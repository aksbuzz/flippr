services:
  postgres:
    image: postgres:17-alpine
    container_name: flippr_postgres
    environment:
      POSTGRES_USER: flippr_user
      POSTGRES_PASSWORD: flippr_password
      POSTGRES_DB: flippr_db
    ports:
      - 5432:5432
    volumes:
      - flippr_postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flippr_user -d flippr_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: flippr_redis
    ports:
      - 6379:6379
    volumes:
      - flippr_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  management-api:
    container_name: flippr_management_api
    build:
      context: ./services/management
    command: npm run start:server
    ports:
      - "${PORT:-4000}:4000"
    environment:
      PORT: 4000
      NODE_ENV: production
      LOG_LEVEL: info
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: flippr_user
      POSTGRES_PASSWORD: flippr_password
      POSTGRES_DATABASE: flippr_db
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  management-worker:
    container_name: flippr_management_worker
    build:
      context: ./services/management
    command: npm run start:worker
    environment:
      NODE_ENV: production
      LOG_LEVEL: info
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: flippr_user
      POSTGRES_PASSWORD: flippr_password
      POSTGRES_DATABASE: flippr_db
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  evaluation-api:
    container_name: flippr_evaluation_api
    build:
      context: ./services/evaluation
    ports:
      - "8080:8080"
    environment:
      SERVER_ADDRESS: ":8080"
      REDIS_ADDR: "redis:6379"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  ui:
    container_name: flippr_ui
    build:
      context: ./ui
    ports:
      - "80:80"
    depends_on:
      - management-api
    restart: unless-stopped

volumes:
  flippr_postgres_data:
  flippr_redis_data:
