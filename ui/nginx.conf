server {
  listen 80;
  server_name _;
  server_tokens off;

  root /usr/share/nginx/html;
  index index.html;

  # Docker's embedded DNS. Together with the variable in proxy_pass below this
  # makes nginx resolve the upstream at request time, so it starts even when
  # management-api is not up yet.
  resolver 127.0.0.11 valid=10s ipv6=off;

  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

  include /etc/nginx/snippets/security-headers.conf;

  # API reverse proxy (the UI calls /api/v1 on its own origin).
  location /api/ {
    set $api_upstream http://management-api:4000;
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    include /etc/nginx/snippets/security-headers.conf;
  }

  # Fingerprinted build assets: cache for a long time.
  location /assets/ {
    try_files $uri =404;
    expires 1y;
    access_log off;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    include /etc/nginx/snippets/security-headers.conf;
  }

  # index.html must always be revalidated so new deploys are picked up.
  location = /index.html {
    add_header Cache-Control "no-cache" always;
    include /etc/nginx/snippets/security-headers.conf;
  }

  location = /health {
    access_log off;
    default_type text/plain;
    return 200 'ok';
  }

  # SPA fallback.
  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-cache" always;
    include /etc/nginx/snippets/security-headers.conf;
  }
}
